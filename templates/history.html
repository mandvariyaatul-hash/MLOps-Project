<!DOCTYPE html>
<html>
<head>
    <title>Prediction History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>📜 Prediction History</h2>
    <a href="/" class="btn btn-secondary mb-3">Back to Predictor</a>
    
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Timestamp</th>
                <th>Glucose</th>
                <th>BMI</th>
                <th>Age</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody>
            {% for row in history %}
            <tr>
                <td>{{ row.Timestamp }}</td>
                <td>{{ row.Glucose }}</td>
                <td>{{ row.BMI }}</td>
                <td>{{ row.Age }}</td>
                <td>
                    <span class="badge {{ 'bg-danger' if row.Result == 'Diabetic' else 'bg-success' }}">
                        {{ row.Result }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% if not history %}
    <p class="text-center">No predictions logged yet.</p>
    {% endif %}
</body>
</html>
