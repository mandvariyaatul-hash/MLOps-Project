name: Build and Deploy Docker to EC2 via ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_TAG=latest
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:$IMAGE_TAG

          echo "ECR_URL=$ECR_URL" >> $GITHUB_ENV

      - name: Set up SSH Key for EC2
        run: |
          cat << 'EOF' > deploy_key.pem
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 400 deploy_key.pem

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts
  
      - name: Debug SSH
        run: |
          ssh -vvv -i deploy_key.pem ec2-user@${{ secrets.EC2_PUBLIC_IP }}  echo "It works!"
      
      - name: Deploy Docker Container on EC2
        run: |
          ssh -i deploy_key.pem ec2-user@${{ secrets.EC2_PUBLIC_IP }} << EOF
            # Setup Docker
            sudo yum update -y
            sudo yum install -y docker
            sudo service docker start
            sudo usermod -aG docker ec2-user
      
            # Export AWS credentials
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export ECR_URL=${{ secrets.ECR_URL }}
      
            # Login to ECR
            aws ecr get-login-password --region \$AWS_REGION | docker login --username AWS --password-stdin \$ECR_URL

            # Pull and run container
            docker stop mlops-project || true
            docker rm mlops-project || true
            
            docker pull \$ECR_URL:latest
            docker run --restart=always -d --name mlops-project -p 8000:8000 -p 5000:5000 \$ECR_URL:latest
          EOF

      - name: Show API Endpoint
        run: |
          echo "✅ App running at: http://${{ secrets.EC2_PUBLIC_IP }}:8000"
          echo "✅ MLFlow running at: http://${{ secrets.EC2_PUBLIC_IP }}:5000"
