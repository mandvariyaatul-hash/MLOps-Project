name: Build and Deploy Docker to EC2 via ECR

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: Build the Docker image & push to ECR
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          IMAGE_TAG=latest
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY

          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:$IMAGE_TAG

  # ==========================================
  # JOB 2: Connect via SSH & deploy on EC2
  # ==========================================
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push # 👈 Forces this job to wait until Job 1 finishes successfully
    steps:
      - name: Set up SSH Key for EC2
        run: |
          cat << 'EOF' > deploy_key.pem
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 400 deploy_key.pem

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Docker Container on EC2
        run: |
          # 💡 Using single quotes 'EOF' prevents GitHub from parsing variables locally
          ssh -i deploy_key.pem ec2-user@${{ secrets.EC2_PUBLIC_IP }}
          # Setup Docker daemon (Skipped yum update to speed up pipeline significantly)
            service docker start
         
            # Recreate environment variables dynamically on the EC2 machine
            AWS_REGION="${{ secrets.AWS_REGION }}"
            ECR_REPOSITORY="${{ secrets.ECR_REPOSITORY }}"
            
            # Export AWS credentials to allow EC2 to talk to ECR
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            
            # Calculate the full ECR Registry URL directly on the EC2 machine
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
         
            # Login to ECR inside EC2
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL
  
            # Stop and clean up old container instances to free up resources
            docker stop mlops-project || true
            docker rm mlops-project || true
            docker image prune -f || true            
            
            # Ensure host volume directories exist before running the container
            mkdir -p "${PWD}/drift_reports"
            touch "${PWD}/prediction_logs.csv"
            
            # ✅ FIX: Explicitly pull the latest image from ECR after the cache prune
            docker pull $ECR_URL:latest
            
            # Run the container with volume mounts and dynamic ECR Image URL
            docker run --restart=always -d \
              -p 8000:8000 \
              -p 5000:5000 \
              -v "${PWD}/drift_reports:/app/drift_reports" \
              -v "${PWD}/prediction_logs.csv:/app/prediction_logs.csv" \
              --name mlops-project $ECR_URL:latest
          EOF

      - name: Show API Endpoint
        run: |
          echo "✅ App running at: http://${{ secrets.EC2_PUBLIC_IP }}:8000"
          echo "✅ MLFlow running at: http://${{ secrets.EC2_PUBLIC_IP }}:5000"
